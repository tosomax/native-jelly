name: SWDEC o24n diagnostic IPK

on:
  workflow_dispatch:
  push:
    branches: [ci/dts-swdec-build]

permissions:
  contents: read

concurrency:
  group: ci-dts-swdec-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-build:
    name: Build SWDEC o24n debug IPK
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - id: ndk
        uses: ./.github/actions/webos-ndk

      - name: Build ARM binary
        run: make WEBOS_SDK='${{ steps.ndk.outputs.sdk-dir }}' -j"$(nproc)"

      - name: Verify platformfix artifact
        run: |
          test -f pkg/libplatformfix.so
          readelf -Ws pkg/libplatformfix.so | grep '_ZN3smp4util37isPlatformSupportSoftwareAudioDecoderENSt7__cxx1112basic_stringIcSt11char_traitsIcESaIcEEE'

      - name: Package debug IPK
        run: make ipk FLAVOR=debug WEBOS_SDK='${{ steps.ndk.outputs.sdk-dir }}'

      - name: Record package hash
        run: sha256sum pkg/*.ipk pkg/libplatformfix.so

      - name: Upload debug IPK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nativejelly-0.11.0-swdec-o24n
          path: pkg/*.ipk
          if-no-files-found: error
          retention-days: 30
